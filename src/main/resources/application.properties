server.port=8081
spring.application.name=mino
server.servlet.context-path=/media


## JPA (JPA Properties)

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy

## DATA (Data source Properties)

spring.datasource.url=jdbc:mysql://localhost:3306/db_mino?useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=mino
spring.datasource.password=password-mino

## SECURITY (Security Properties)

spring.security.user.name=user
spring.security.user.password=password

## MVC (MVC Properties)

spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

## MULTIPART (Multipart Properties)

# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB

# Max file size.
spring.servlet.multipart.max-file-size=10MB

# Max Request Size
spring.servlet.multipart.max-request-size=100MB

## SWAGGER (Swagger Properties)
swagger.api.version=1.0

## Logging
logging.level.org.hibernate=ERROR


